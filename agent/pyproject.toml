[project]
name = "ditto-agent"
version = "0.1.0"
description = "ditto — 오해 방지 레이어: LLM 프롬프트 + LangGraph 에이전트 (AI 모델 파트)"
authors = [
    { name = "kayo2e", email = "gy30356635@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=1.60.0",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
